[build]
  command = "node scripts/prepare-site.mjs"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/published/menu.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/published/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Não reescrever todas as URLs para index.html: o gestor tem uma entrada própria.
[[redirects]]
  from = "/api/publish-menu"
  to = "/.netlify/functions/publish-menu"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/cloud-config.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
